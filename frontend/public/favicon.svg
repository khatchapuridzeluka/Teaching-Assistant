<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Teaching Assistant</title>
  <!-- Checked code: code brackets around a check, on the app's green tile. Strokes are thick so it stays readable at
       16 px in a browser tab. -->
  <rect width="32" height="32" rx="7" fill="#2f5e4e"/>
  <path d="M10.5 9 5.5 16l5 7" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M21.5 9 26.5 16l-5 7" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m12.5 16.5 2.6 2.6 4.6-5.6" fill="none" stroke="#9fe1cb" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
